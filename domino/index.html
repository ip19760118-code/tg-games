gba(120,180,100,0.2)}.btn-secondary:hover:not(:disabled){background:rgba(80,140,80,0.4)}.message{text-align:center;padding:6px 0 2px;font-size:15px;font-weight:500;color:var(--msg);min-height:30px;letter-spacing:0.2px;text-shadow:0 1px 6px var(--shadow)}.end-overlay{display:none;position:absolute;inset:-20px -20px -20px -20px;background:rgba(0,0,0,0.65);backdrop-filter:blur(6px);border-radius:28px;justify-content:center;align-items:center;z-index:30;flex-direction:column;gap:12px;padding:20px}.end-overlay.show{display:flex}.end-overlay .big{font-size:28px;font-weight:700;color:var(--text);text-shadow:0 4px 20px var(--shadow);text-align:center}.end-overlay .sub{font-size:18px;color:var(--text);text-align:center}.end-overlay .btn{margin-top:6px}.board-wrapper{position:relative}.hand-scroll{overflow-x:auto;overflow-y:visible;padding:2px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}.hand-scroll::-webkit-scrollbar{height:4px}.hand-scroll::-webkit-scrollbar-track{background:rgba(0,0,0,0.2);border-radius:10px}.hand-scroll::-webkit-scrollbar-thumb{background:rgba(200,180,140,0.3);border-radius:10px}.hand-scroll .hand{flex-wrap:nowrap;justify-content:flex-start;padding:4px 6px;min-height:50px}

x}.end-overlay .big{font-size:22px}.end-overlay .sub{font-size:16px}}

<script>
/* ================== TELEGRAM MINI APP ================== */
const tg = window.Telegram?.WebApp;

if (tg) {
  try {
    tg.ready();
    tg.expand();
    if (typeof tg.disableVerticalSwipes === 'function') tg.disableVerticalSwipes();
  } catch (e) {}
}

function tgHaptic(type) {
  try {
    const h = tg?.HapticFeedback;
    if (!h) return;
    if (type === 'success') h.notificationOccurred('success');
    else if (type === 'error') h.notificationOccurred('error');
    else if (type === 'warning') h.notificationOccurred('warning');
    else if (type === 'heavy') h.impactOccurred('heavy');
    else if (type === 'medium') h.impactOccurred('medium');
    else h.impactOccurred('light');
  } catch (e) {}
}

function goToHub() {
  tgHaptic('light');
  location.href = '../';
}

function tgHeaderColor(color) {
  try {
    if (tg && typeof tg.setHeaderColor === 'function') tg.setHeaderColor(color);
    if (tg && typeof tg.setBackgroundColor === 'function') tg.setBackgroundColor(color);
  } catch (e) {}
}

/* Умный BackButton:
   - открыта модалка настроек → закрыть её
   - иначе → возврат в хаб
*/
function backButtonHandler() {
  try {
    if (settingsModal.classList.contains('show')) {
      settingsModal.classList.remove('show');
      return;
    }
  } catch (e) {}
  goToHub();
}

if (tg?.BackButton) {
  tg.BackButton.show();
  tg.BackButton.onClick(backButtonHandler);
}

/* ---------- ПОМОЩНИК ДЛЯ СОБЫТИЙ GOOGLE ANALYTICS ---------- */
function trackEvent(name, params) {
  try {
    if (typeof gtag === 'function') {
      gtag('event', name, params);
    }
  } catch (e) {}
}

/* ---------- СОБЫТИЕ: ОТКРЫТИЕ ИГРЫ (1 раз за сессию) ---------- */
(function trackGameOpen() {
  try {
    const key = 'domino_session_tracked';
    if (!sessionStorage.getItem(key)) {
      sessionStorage.setItem(key, '1');

      let source = 'browser';
      const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
      if (tgUser) source = 'telegram';

      trackEvent('game_open', {
        game_name: 'domino',
        source: source
      });
    }
  } catch (e) {}
})();
/* =========================================================== */

let W=70,H=35,GAP=2;
function updateTileSize(){const w=window.innerWidth;if(w<=425){W=56;H=28;GAP=2;}else{W=70;H=35;GAP=2;}}
updateTileSize();

const VALUES=[0,1,2,3,4,5,6],ALL_TILES=[];for(let i=0;i<=6;i++)for(let j=i;j<=6;j++)ALL_TILES.push([i,j]);
const DOT_PATTERNS={
0:[],
1:[[1,1]],
2:[[0,0],[2,2]],
3:[[0,0],[1,1],[2,2]],
4:[[0,0],[2,0],[0,2],[2,2]],
5:[[0,0],[2,0],[0,2],[2,2],[1,1]],
6:[[0,0],[1,0],[2,0],[0,2],[1,2],[2,2]]
};

const boardCanvas=document.getElementById('boardCanvas'),playerHandEl=document.getElementById('playerHand'),computerHandEl=document.getElementById('computerHand'),playerScoreEl=document.getElementById('playerScore'),computerScoreEl=document.getElementById('computerScore'),playerCountEl=document.getElementById('playerCount'),computerCountEl=document.getElementById('computerCount'),bankCountEl=document.getElementById('bankCount'),messageEl=document.getElementById('message'),turnTextEl=document.getElementById('turnText'),turnBadgeEl=document.getElementById('turnBadge'),drawBtn=document.getElementById('drawBtn'),passBtn=document.getElementById('passBtn'),newGameBtn=document.getElementById('newGameBtn'),endOverlay=document.getElementById('endOverlay'),endTitle=document.getElementById('endTitle'),endSub=document.getElementById('endSub'),endNewGameBtn=document.getElementById('endNewGameBtn'),settingsBtn=document.getElementById('settingsBtn'),settingsModal=document.getElementById('settingsModal'),closeSettingsBtn=document.getElementById('closeSettingsBtn'),difficultySelect=document.getElementById('difficultySelect'),volumeSlider=document.getElementById('volumeSlider'),themeSelect=document.getElementById('themeSelect'),totalGames=document.getElementById('totalGames'),playerWins=document.getElementById('playerWins'),computerWins=document.getElementById('computerWins'),draws=document.getElementById('draws'),resetStatsBtn=document.getElementById('resetStatsBtn'),blindModeCheck=document.getElementById('blindMode'),hubBtn=document.getElementById('hubBtn');
let state={},audioCtx=null,volume=0.5;

function getVolume(){return parseFloat(volumeSlider.value)/100}

function ensureAudioContext(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type){
  const vol = getVolume();
  if(vol === 0) return;
  ensureAudioContext();
  const ctx = audioCtx;
  const now = ctx.currentTime;

  try{
    if(type === 'move'){
      const bufferSize = ctx.sampleRate * 0.08;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i=0; i<bufferSize; i++){
        data[i] = (Math.random()*2 - 1) * Math.exp(-i/(ctx.sampleRate*0.02));
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(vol*0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now+0.08);
      noise.connect(gain);
      gain.connect(ctx.destination);
      noise.start(now);
      noise.stop(now+0.08);
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = 180;
      const g2 = ctx.createGain();
      g2.gain.setValueAtTime(vol*0.2, now);
      g2.gain.exponentialRampToValueAtTime(0.001, now+0.06);
      osc.connect(g2);
      g2.connect(ctx.destination);
      osc.start(now);
      osc.stop(now+0.06);
      tgHaptic('medium');
    }
    else if(type === 'draw'){
      const osc = ctx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.value = 800;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(vol*0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now+0.04);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now+0.04);
      tgHaptic('light');
    }
    else if(type === 'win'){
      const notes = [523, 587, 659, 784, 880, 988, 1175];
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        osc.type = 'square';
        osc.frequency.value = freq;
        const gain = ctx.createGain();
        const start = now + i * 0.12;
        gain.gain.setValueAtTime(vol*0.08, start);
        gain.gain.exponentialRampToValueAtTime(0.001, start+0.15);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start+0.15);
      });
      tgHaptic('success');
    }
    else if(type === 'lose'){
      const notes = [523, 494, 466, 440, 392, 370, 349];
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.value = freq;
        const gain = ctx.createGain();
        const start = now + i * 0.15;
        gain.gain.setValueAtTime(vol*0.06, start);
        gain.gain.exponentialRampToValueAtTime(0.001, start+0.2);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start+0.2);
      });
      tgHaptic('error');
    }
    else if(type === 'error'){
      const osc = ctx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.value = 150;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(vol*0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now+0.15);
      osc.connect(gain);
      gain.connect(ctx.destination);

function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}

function drawHalf(ctx,n,xOff,yOff,width,height,dotRadius){
  const pad=width*0.1;
  const cellW=(width-2*pad)/3;
  const cellH=(height-2*pad)/3;
  const pos=DOT_PATTERNS[n]||[];
  for(let [r,c] of pos){
    const x=xOff+pad+c*cellW+cellW/2;
    const y=yOff+pad+r*cellH+cellH/2;
    ctx.beginPath();
    ctx.arc(x,y,dotRadius,0,Math.PI*2);
    ctx.fillStyle='#1a1a1a';
    ctx.shadowColor='rgba(0,0,0,0.15)';
    ctx.shadowBlur=2;
    ctx.fill();
    ctx.shadowBlur=0;
  }
}

function drawTile(ctx,cx,cy,w,h,left,right,faceUp=true,angle=0,vertical=false){
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(angle*Math.PI/180);
  ctx.translate(-w/2,-h/2);
  const r=6,dotR=Math.max(3,w*0.045);
  ctx.clearRect(0,0,w,h);
  if(!faceUp){
    const g=ctx.createLinearGradient(0,0,w,h);
    g.addColorStop(0,'#3a3a4e');
    g.addColorStop(0.5,'#2a2a3a');
    g.addColorStop(1,'#1e1e2e');
    ctx.fillStyle=g;
    roundRect(ctx,0,0,w,h,r);
    ctx.fill();
    ctx.strokeStyle='#4a4a5e';
    ctx.lineWidth=1;
    roundRect(ctx,0,0,w,h,r);
    ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.04)';
    ctx.lineWidth=1;
    for(let i=-h;i<w+h;i+=8){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i+h,h);ctx.stroke()}
    ctx.restore();
    return;
  }
  const bg=ctx.createLinearGradient(0,0,w*0.2,h*0.8);
  bg.addColorStop(0,'#fffef8');
  bg.addColorStop(0.5,'#f5f0e6');
  bg.addColorStop(1,'#e8e0d0');
  ctx.fillStyle=bg;
  roundRect(ctx,0,0,w,h,r);
  ctx.fill();
  ctx.shadowColor='rgba(0,0,0,0.3)';
  ctx.shadowBlur=8;
  ctx.shadowOffsetX=2;
  ctx.shadowOffsetY=3;
  ctx.strokeStyle='#b8ae96';
  ctx.lineWidth=1.5;
  roundRect(ctx,0,0,w,h,r);
  ctx.stroke();
  ctx.shadowBlur=0;
  ctx.shadowOffsetX=0;
  ctx.shadowOffsetY=0;

  if(vertical){
    const halfH=h/2;
    ctx.beginPath();
    ctx.moveTo(0,halfH);
    ctx.lineTo(w,halfH);
    ctx.strokeStyle='#b8ae96';
    ctx.lineWidth=1.2;
    ctx.stroke();
    drawHalf(ctx,left,0,0,w,halfH,dotR);
    drawHalf(ctx,right,0,halfH,w,halfH,dotR);
  }else{
    const halfW=w/2;
    ctx.beginPath();
    ctx.moveTo(halfW,0);
    ctx.lineTo(halfW,h);
    ctx.strokeStyle='#b8ae96';
    ctx.lineWidth=1.2;
    ctx.stroke();
    drawHalf(ctx,left,0,0,halfW,h,dotR);
    drawHalf(ctx,right,halfW,0,halfW,h,dotR);
  }
  ctx.restore();
}

function createTile(l,r,faceUp=true,clickable=false,vertical=false){
  const div=document.createElement('div');
  div.className='tile'+(faceUp?'':' face-down')+(clickable?' clickable':'');
  const c=document.createElement('canvas');
  div.appendChild(c);
  const w=vertical?H:W;
  const h=vertical?W:H;
  c.width=w;
  c.height=h;
  c.style.width=w+'px';
  c.style.height=h+'px';
  div._c=c;
  div._l=l;
  div._r=r;
  div._faceUp=faceUp;
  div._vertical=vertical;
  renderTile(div);
  return div;
}

function renderTile(div){
  const ctx=div._c.getContext('2d');
  const w=div._c.width;
  const h=div._c.height;
  const vertical=div._vertical||false;
  drawTile(ctx,w/2,h/2,w,h,div._l,div._r,div._faceUp,0,vertical);
}

function initGame(){

  let tiles=shuffle([...ALL_TILES]),ph=tiles.splice(0,7),ch=tiles.splice(0,7),by=tiles;let best=-1,bestTile=null,starter=null;for(let t of ph)if(t[0]==t[1]&&t[0]>best){best=t[0];bestTile=t}

  bestTile=mt;starter=ow}

  state={boneyard:by,playerHand:ph,computerHand:ch,board,leftEnd,rightEnd,currentTurn:turn,playerScore:state.playerScore||0,computerScore:state.computerScore||0,gameOver:false,passCount:0,winner:null,turnLock:false};endOverlay.classList.remove('show');render();updateMessage('🎯 Игра началась! '+(turn==='player'?'Ваш ход.':'Ход компьютера...'));if(turn==='computer')setTimeout(()=>computerTurn(),500)}
function canPlayOnLeft(t){return state.board.length===0||t[0]==state.leftEnd||t[1]==state.leftEnd}
function canPlayOnRight(t){return state.board.length===0||t[0]==state.rightEnd||t[1]==state.rightEnd}

function playTileOnRight(t){let end=state.rightEnd;let placed;if(t[0]==end){placed=[t[0],t[1]];state.rightEnd=t[1]}else if(t[1]==end){placed=[t[1],t[0]];state.rightEnd=t[0]}else return false;state.board.push(placed);return true}

    updateMessage('🎯 Ваш ход. Выберите кость.');

}}
function checkGameOver(){
  if(state.gameOver)return true;
  if(!state.playerHand.length){state.gameOver=true;state.winner='player';state.playerScore++;updateStats('player');endGame('🏆 Вы победили!','Вы выложили все кости!');return true}
  if(!state.computerHand.length){state.gameOver=true;state.winner='computer';state.computerScore++;updateStats('computer');endGame('💻 Компьютер победил!','Компьютер выложил все кости.');return true}
  let pm=getLegalMoves(state.playerHand),cm=getLegalMoves(state.computerHand);
  if(!pm.length&&!cm.length&&!state.boneyard.length){
    state.gameOver=true;
    let pc=state.playerHand.length,cc=state.computerHand.length;
    if(pc<cc){state.winner='player';state.playerScore++;updateStats('player');endGame('🏆 Вы победили!','У вас '+pc+' костей, у компьютера '+cc+'.')}
    else if(cc<pc){state.winner='computer';state.computerScore++;updateStats('computer');endGame('💻 Компьютер победил!','У компьютера '+cc+' костей, у вас '+pc+'.')}

1]?10:0)+(b.ends.includes('right')?2:0);return sa>sb?a:b});}let tile=chosenMove.tile,idx=chosenMove.index;let chosenEnd=chosenMove.ends.includes('right')?'right':chosenMove.ends[0];hand.splice(idx,1);playTile(tile,chosenEnd);state.passCount=0;playSound('move');render();updateMessage('💻 Компьютер сыграл ['+tile[0]+'|'+tile[1]+']');if(checkGameOver()){render();playerScoreEl.textContent=state.playerScore;computerScoreEl.textContent=state.computerScore;state.turnLock=false;return}switchTurn();state.turnLock=false}}

function renderBoard(){const canvas=boardCanvas,ctx=canvas.getContext('2d'),board=state.board;if(!board||!board.length){canvas.width=400;canvas.height=100;canvas.style.width='400px';canvas.style.height='100px';ctx.clearRect(0,0,400,100);ctx.fillStyle='rgba(255,255,255,0.25)';ctx.font='20px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🀄 Ожидание первой кости...',200,50);return}const containerWidth=canvas.parentElement.clientWidth-32;const maxPerRow=Math.max(1,Math.floor((containerWidth+GAP)/(W+GAP)));const total=board.length;let positions=[],idx=0,y=0,dir=1,x_start=0;while(idx<total){let count=Math.min(maxPerRow,total-idx);const rowY=y;for(let j=0;j<count;j++){const tile=board[idx+j];let x;if(dir===1){x=x_start+j*(W+GAP);}else{x=x_start-j*(W+GAP);}let leftVal,rightVal;if(dir===1){leftVal=tile[0];rightVal=tile[1];}else{leftVal=tile[1];rightVal=tile[0];}positions.push({cx:x+W/2,cy:rowY+H/2,w:W,h:H,angle:0,left:leftVal,right:rightVal});}idx+=count;if(idx<total){if(idx+1<total){const vertTile=board[idx];const prevIdx=idx-1;const nextIdx=idx+1;const prevRight=board[prevIdx][1];const nextLeft=board[nextIdx][0];let leftVert,rightVert;if(vertTile[0]==prevRight&&vertTile[1]==nextLeft){leftVert=prevRight;rightVert=nextLeft;}else if(vertTile[1]==prevRight&&vertTile[0]==nextLeft){leftVert=prevRight;rightVert=nextLeft;}else{leftVert=vertTile[0];rightVert=vertTile[1];}let xv,yv;if(dir===1){xv=x_start+(count-1)*(W+GAP)+W;yv=rowY;}else{xv=x_start-(count-1)*(W+GAP)-H;yv=rowY;}positions.push({cx:xv+H/2,cy:yv+W/2,w:W,h:H,angle:90,left:leftVert,right:rightVert});y+=W+GAP;const oldDir=dir;dir=-dir;if(oldDir===1){x_start=xv+H-W;}else{x_start=xv;}idx++;}else{const lastTile=board[idx];let x;if(dir===1){x=x_start+count*(W+GAP);}else{x=x_start-count*(W+GAP);}let leftVal,rightVal;if(dir===1){leftVal=lastTile[0];rightVal=lastTile[1];}else{leftVal=lastTile[1];rightVal=lastTile[0];}positions.push({cx:x+W/2,cy:rowY+H/2,w:W,h:H,angle:0,left:leftVal,right:rightVal});idx   trackEvent('settings_change', {
    game_name: 'domino',
    setting: 'theme',
    value: themeSelect.value
  });
});
blindModeCheck.addEventListener('change',()=>{
  localStorage.setItem('dominoBlind',blindModeCheck.checked?'true':'false');
  if(!state.gameOver)render();
  /* ---------- GA: СМЕНА РЕЖИМА ВСЛЕПУЮ ---------- */
  trackEvent('settings_change', {
    game_name: 'domino',
    setting: 'blind_mode',
    value: blindModeCheck.checked
  });
});
resetStatsBtn.addEventListener('click',()=>{if(confirm('Сбросить статистику?')){saveStats({total:0,playerWins:0,computerWins:0,draws:0});displayStats()}});

/* Кнопка возврата в хаб */
hubBtn.addEventListener('click', goToHub);

(function loadSettings(){let diff=localStorage.getItem('dominoDiff');if(diff)difficultySelect.value=diff;let vol=localStorage.getItem('dominoVol');if(vol)volumeSlider.value=vol;let theme=localStorage.getItem('dominoTheme');if(theme){themeSelect.value=theme;applyTheme(theme)}else applyTheme('green');let blind=localStorage.getItem('dominoBlind');if(blind==='true')blindModeCheck.checked=true;else blindModeCheck.checked=false;displayStats()})();
drawBtn.addEventListener('click',playerDraw);passBtn.addEventListener('click',playerPass);newGameBtn.addEventListener('click',()=>{if(state.gameOver)endOverlay.classList.remove('show');initGame()});endNewGameBtn.addEventListener('click',()=>{endOverlay.classList.remove('show');initGame()});
state={playerScore:0,computerScore:0};initGame();let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{updateTileSize();if(!state.gameOver)render()},300)});
</script>
</body>
