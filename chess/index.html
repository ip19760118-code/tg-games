<style>
:root{
  --bg1:#101418; --bg2:#1c2430; --bg3:#080a0d;
  --panel:rgba(24,32,44,0.85); --text:#e8ecf2; --accent:#7cffc4;
  --sq-light:#f0d9b5; --sq-dark:#b58863;
  --shadow:rgba(0,0,0,0.6);
  --bs:min(92vw, 460px);
}
[data-theme="green"]{ --sq-light:#eeeed2; --sq-dark:#769656; }
[data-theme="neon"]{ --sq-light:#3b3f63; --sq-dark:#23263c; }
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:var(--bg1);background:radial-gradient(ellipse at center,var(--bg2),var(--bg3));font-family:'Segoe UI',Roboto,system-ui,sans-serif;color:var(--text);display:flex;justify-content:center;align-items:flex-start;padding:12px;padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.game-container{max-width:560px;width:100%;background:var(--panel);backdrop-filter:blur(4px);border-radius:28px;padding:16px;box-shadow:0 20px 60px var(--shadow);border:1px solid rgba(255,255,255,0.08)}
.header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.title{font-size:22px;font-weight:700;letter-spacing:1px}
.hbtns{display:flex;gap:8px}
.hbtn{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);color:var(--text);border-radius:30px;padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.hbtn:active{transform:scale(0.95)}
.hbtn.hub{opacity:0.75}
.status{text-align:center;font-size:15px;font-weight:600;min-height:24px;margin-bottom:6px;color:var(--accent);text-shadow:0 1px 4px rgba(0,0,0,0.5)}
.status.warn{color:#ff6b6b}

/* Панель комнаты */
.room-bar{background:rgba(0,0,0,0.25);border:1px solid rgba(124,255,196,0.2);border-radius:14px;padding:8px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.room-bar .code{font-weight:700;font-family:monospace;letter-spacing:2px;font-size:16px;color:var(--accent);background:rgba(0,0,0,0.3);padding:3px 8px;border-radius:6px}
.room-bar .info{color:var(--text);opacity:0.9}
.room-bar .info b{color:#fff}
.room-actions{display:flex;gap:6px;flex-wrap:wrap}
.room-actions .rbtn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:var(--text);border-radius:20px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.room-actions .rbtn:active{transform:scale(0.95)}
.room-actions .rbtn.danger{border-color:rgba(255,80,80,0.4);color:#ff9a9a}
.room-actions .rbtn.accept{border-color:rgba(124,255,196,0.5);color:var(--accent)}
.room-actions .rbtn:disabled{opacity:0.4;cursor:not-allowed}

.caprow{display:flex;justify-content:space-between;min-height:22px;font-size:16px;letter-spacing:1px;margin:2px 4px;opacity:0.9}

#board{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  grid-template-rows:repeat(8,1fr);
  width:var(--bs);
  height:var(--bs);
  margin:6px auto;
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 10px 30px var(--shadow),0 0 0 3px rgba(255,255,255,0.08);
}
.sq{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:0;
  min-height:0;
  overflow:hidden;
}
.sq.light{background:var(--sq-light)}
.sq.dark{background:var(--sq-dark)}
.sq.sel{box-shadow:inset 0 0 0 4px rgba(124,255,196,0.9)}
.sq.last{box-shadow:inset 0 0 0 4px rgba(255,215,80,0.55)}
.sq.chk{box-shadow:inset 0 0 0 4px rgba(255,60,60,0.9)}
.sq.tgt::after{content:'';position:absolute;inset:36%;border-radius:50%;background:rgba(60,180,110,0.55);box-shadow:0 0 8px rgba(60,180,110,0.5)}
.sq.capT::after{content:'';position:absolute;inset:6%;border-radius:50%;border:4px solid rgba(255,80,80,0.75);background:transparent}
.pc{font-size:calc(var(--bs)/8*0.78);line-height:1;pointer-events:none}
.pc.w{color:#ffffff;text-shadow:0 2px 3px rgba(0,0,0,0.65)}
.pc.b{color:#141414;text-shadow:0 0 4px rgba(255,255,255,0.35),0 2px 3px rgba(0,0,0,0.4)}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);color:var(--text);padding:9px 18px;border-radius:30px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:0.15s}
.btn:active{transform:scale(0.96)}
.btn:disabled{opacity:0.35;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,#7cffc4,#33d6ff);color:#061019;border:none}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(5px);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.overlay.show{display:flex}
.card{background:var(--panel);border:1px solid rgba(255,255,255,0.12);border-radius:24px;padding:24px;max-width:400px;width:100%;text-align:center;box-shadow:0 20px 60px var(--shadow)}
.card h2{font-size:26px;margin-bottom:8px}
.card .sub{opacity:0.8;margin-bottom:16px;font-size:15px}
.card .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.promo-row{display:flex;gap:10px;justify-content:center;margin:14px 0}
.promo-btn{width:64px;height:64px;font-size:44px;border-radius:14px;border:2px solid rgba(255,255,255,0.25);background:var(--sq-light);cursor:pointer;display:flex;align-items:center;justify-content:center}
.promo-btn:active{transform:scale(0.94)}

/* Экран выбора режима */
.mode-choice{display:flex;flex-direction:column;gap:12px;margin:10px 0}
.mode-btn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);color:var(--text);border-radius:18px;padding:16px;cursor:pointer;font-family:inherit;text-align:left;display:flex;gap:14px;align-items:center;transition:0.15s}
.mode-btn:active{transform:scale(0.98);background:rgba(255,255,255,0.1)}
.mode-btn .icon{font-size:32px}
.mode-btn .txt{display:flex;flex-direction:column;gap:3px}
.mode-btn .txt b{font-size:16px}
.mode-btn .txt small{font-size:13px;opacity:0.75}
.mode-btn.primary{background:linear-gradient(135deg,rgba(124,255,196,0.2),rgba(51,214,255,0.15));border-color:var(--accent)}

/* Join by code */
.code-input{display:flex;gap:8px;justify-content:center;margin:14px 0}
.code-input input{width:140px;font-size:22px;text-align:center;padding:8px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.2);border-radius:10px;color:var(--text);font-family:monospace;letter-spacing:4px;text-transform:uppercase}
.code-input input:focus{outline:none;border-color:var(--accent)}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(4px);z-index:110;justify-content:center;align-items:center;padding:16px}
.modal.show{display:flex}
.modal-content{background:var(--panel);border:1px solid rgba(255,255,255,0.12);border-radius:24px;padding:22px;max-width:400px;width:100%;color:var(--text);max-height:88vh;overflow-y:auto;text-align:left}
.modal-content h2{font-size:22px;margin-bottom:14px;text-align:center}
.srow{margin:14px 0}
.srow>label{display:block;font-weight:600;font-size:13px;margin-bottom:6px;letter-spacing:0.5px;text-transform:uppercase;opacity:0.8}
.srow select,.srow input[type=range]{width:100%;padding:7px;border-radius:10px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.15);color:var(--text);font-size:14px}
.stat-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.06);font-size:14px}
.modal-close{text-align:center;margin-top:16px}
.online-score{display:flex;gap:16px;justify-content:center;margin:4px 0 8px;font-size:14px;color:var(--text);opacity:0.9}
.online-score b{color:var(--accent)}
</style>
</head>

<div class="game-container">
  <div class="header">
    <button class="hbtn hub" id="hubBtn">← В меню игр</button>
    <div class="title">♟️ ШАХМАТЫ</div>

  <div id="board"></div>
  <div class="controls">
    <button class="btn primary" id="newBtn">🔄 Новая игра</button>
    <button class="btn" id="undoBtn">↩️ Отменить ход</button>
  </div>
</div>

<!-- Выбор режима игры -->
<div class="overlay" id="modeOverlay">
  <div class="card">
    <h2>♟️ Шахматы</h2>
    <div class="sub">Выбери режим игры</div>
    <div class="mode-choice">
      <button class="mode-btn" id="modeAi">
        <div class="icon">🖥</div>
        <div class="txt"><b>Против компьютера</b><small>3 уровня сложности</small></div>
      </button>
      <button class="mode-btn primary" id="modeHost">
        <div class="icon">👥</div>
        <div class="txt"><b>Играть с другом</b><small>Создать комнату и пригласить</small></div>
      </button>
      <button class="mode-btn" id="modeJoin">
        <div class="icon">🎯</div>
        <div class="txt"><b>Зайти по коду</b><small>Уже есть код комнаты</small></div>
      </button>
    </div>
    <div class="code-input" id="joinCodeBox" style="display:none">
      <input id="joinCodeInput" type="text" maxlength="6" placeholder="ABC123" />
    </div>
    <div class="btns" id="joinCodeActions" style="display:none">
      <button class="btn" id="joinCancel">Отмена</button>
      <button class="btn primary" id="joinGo">Войти</button>
    </div>
  </div>
</div>

<!-- Выбор фигуры при превращении пешки -->
<div class="overlay" id="promoOverlay">
  <div class="card">
    <h2>Превращение пешки</h2>
    <div class="sub">Выбери фигуру</div>
    <div class="promo-row" id="promoRow"></div>
    <div class="btns"><button class="btn" id="promoCancel">Отмена</button></div>
  </div>
</div>

<!-- Конец игры -->
<div class="overlay" id="endOverlay">
  <div class="card">
    <h2 id="endTitle">🏆 Победа!</h2>
    <div class="sub" id="endSub">Мат противнику</div>
    <div class="btns" id="endBtns">
      <button class="btn primary" id="endNewBtn">🔄 Ещё партию</button>
      <button class="btn" id="endShareBtn">📤 Поделиться</button>
      <button class="btn" id="endHubBtn">🏠 В меню игр</button>
    </div>
  </div>
</div>

<!-- Настройки -->
<div class="modal" id="settingsModal">
  <div class="modal-content">
    <h2>⚙️ Настройки</h2>
    <div class="srow"><label>Сложность</label>
      <select id="diffSelect">
        <option value="easy">Лёгкая</option>
        <option value="medium" selected>Средняя</option>
        <option value="hard">Сложная</option>
      </select>
    </div>
    <div class="srow"><label>Играть за (одиночный режим)</label>
      <select id="sideSelect">
        <option value="w" selected>Белых</option>
        <option value="b">Чёрных</option>
      </select>
    </div>
    <div class="srow"><label>Тема доски</label>
      <select id="themeSelect">
        <option value="classic" selected>Классика</option>
        <option value="green">Зелёная</option>
        <option value="neon">Неон</option>
      </select>
    </div>
    <div class="srow"><label>Громкость · <span id="volV">50%</span></label>
      <input type="range" id="volSlider" min="0" max="100" value="50">
    </div>
    <div class="srow"><label>📊 Статистика (одиночная)</label>
      <div class="stat-row"><span>Побед:</span><b id="stW">0</b></div>
      <div class="stat-row"><span>Поражений:</span><b id="stL">0</b></div>
      <div class="stat-row"><span>Ничьих:</span><b id="stD">0</b></div>
      <button class="btn" style="width:100%;margin-top:8px" id="resetStatsBtn">Сбросить статистику</button>
    </div>
    <div class="modal-close"><button class="btn" id="closeSettingsBtn">Закрыть</button></div>
  </div>
</div>

function initialBoard(){
  const b=new Array(64).fill(null);
  const back=['R','N','B','Q','K','B','N','R'];
  for(let c=0;c<8;c++){
    b[c]={t:back[c],c:'b'};
    b[8+c]={t:'P',c:'b'};
    b[48+c]={t:'P',c:'w'};
    b[56+c]={t:back[c],c:'w'};
  }
  return b;
}

let lastAppliedMoveKey = null;

function getUserName(){
  try{
    const u = window.Telegram?.WebApp?.initDataUnsafe?.user;
    if (u) return u.first_name || ('id' + u.id);
  }catch(e){}
  const saved = localStorage.chess_name;
  if (saved) return saved;
  const name = 'Игрок' + Math.floor(Math.random()*900+100);
  localStorage.chess_name = name;
  return name;
}

function waitForFB(){
  return new Promise(res=>{
    if (window.__FB__) return res(window.__FB__);
    window.addEventListener('fb-ready', ()=>res(window.__FB__), { once:true });
    // таймаут 5 секунд — если FB не загрузился
    setTimeout(()=>res(window.__FB__), 5000);
  });
}

function genRoomCode(){
  const letters='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s=''; for(let i=0;i<6;i++) s+=letters[Math.floor(Math.random()*letters.length)];
  return s;
}

function inviteLink(code){
  const url = new URL(location.href);
  url.searchParams.set('room', code);
  url.hash = '';
  return url.toString();
}

/* ---------- Подписки на комнату ---------- */
function subscribeRoom(){
  const { onChildAdded, onValue, ref } = window.__FB__;
  // История ходов (child_added — срабатывает и для существующих)
  const movesRef = ref(roomRef, 'moves');
  let firstLoad = true;
  const movesSnapshots = [];
  onChildAdded(movesRef, snap=>{
    const m = snap.val();
    if (!m) return;
    m._key = snap.key;
    movesSnapshots.push({ key:snap.key, at:m.at||0, m });
    if (firstLoad) return; // до onValue "value" собираем, применяем оптом
    //增量: применить, если это не наш ход
    if (m.by !== mySideOnline){
      applyRemoteMove(m);
    } else {
      // это наш ход — уже применён локально при отправке
    }
    lastAppliedMoveKey = snap.key;
  });
  onValue(movesRef, snap=>{
    if (!firstLoad) return;
    // первое получение: воспроизвести всю историю ходов в порядке at
    firstLoad = false;
    const items=[];
    snap.forEach(ch=>{
      const m=ch.val(); if(!m) return;
      items.push({ key:ch.key, at:m.at||0, m });
    });
    items.sort((a,b)=>a.at-b.at);
    // сбросить доску и проиграть ходы
    board=initialBoard(); turn='w'; castling={wK:true,wQ:true,bK:true,bQ:true}; epTarget=-1; halfmove=0; moveLog=[]; undoStack=[];
    for (const it of items){
      try{
        const legal = genLegal(turn);
        const cand = legal.find(x=>x.from===it.m.from && x.to===it.m.to && x.promo===(it.m.promo||null));
        if (cand){
          makeMove(cand);
          if (it.m.by !== mySideOnline){
            // звук
            cand.captured? sCap() : sMove();
          }
        }
        lastAppliedMoveKey = it.key;
      }catch(e){}
    }
    render();
    updateOnlineStatus();
  });

  // Флаги и статус
  onValue(roomRef, snap=>{
    const room = snap.val();
    if (!room){
      showStatus('❌ Комната удалена');
      leaveRoom();
      return;
    }
    // присутствие
    opponentOnline = !!(room.presence && room.presence[mySideOnline==='w'?'b':'w']);
    // игроки
    const players = room.players||{};
    $('roomInfo').innerHTML = `Ты (<b>${mySideOnline==='w'?'белые':'чёрные'}</b>) · Соперник: ${
      players[mySideOnline==='w'?'b':'w']?.name
        ? `<b>${escapeHtml(players[mySideOnline==='w'?'b':'w'].name)}</b>`
        : '<i>ожидание...</i>'
    }`;
    // флаги
    const fl = room.flags||{};
    if (fl.drawOffer && fl.drawOffer !== mySideOnline && !fl.drawAccept){
      showDrawOffer(fl.drawOffer);
    }
    if (fl.drawAccept){
      endGame(null, 'draw_agreed');
    }
    if (fl.surrender){
      const winner = fl.surrender==='w'?'b':'w';
      endGame(winner, 'surrender');
    }
    if (fl.rematchOffer && fl.rematchOffer !== mySideOnline && !fl.rematchAccept){
      showRematchOffer(fl.rematchOffer);
    }
    if (fl.rematchAccept && fl.rematchOffer){
      startRematch();
    }
    if (fl.winner){
      if (!gameOver){
        endGame(fl.winner, 'flag');
      }
    }
    updateRoomActions();
    updateOnlineStatus();
  });

  // Присутствие
  const { set, onDisconnect } = window.__FB__;
  const pres = ref(roomRef, 'presence/' + mySideOnline);
  set(pres, { name: myName, at: Date.now() });
  onDisconnect(pres).remove();
}

function updateOnlineStatus(){
  const hasOpponent = opponentOnline;
  const oppName = $('roomInfo').innerHTML.includes('ожидание');
  if (!hasOpponent || oppName){
    if (gameOver) return;
    if (turn === mySideOnline) showStatus('🕓 Твой ход');
    else showStatus(oppName ? '🔗 Поделись ссылкой с другом' : '⏳ Ожидание соперника...');
  } else {
    if (gameOver) return;
    if (turn === mySideOnline) showStatus('🕓 Твой ход');
    else showStatus('🤔 Ход соперника...');
  }
}

/* ---------- Создание и вход в комнату ---------- */
async function createRoom(){
  const { set, ref } = window.__FB__;
  await waitForFB();
  roomCode = genRoomCode();
  mySideOnline = 'w';
  myName = getUserName();
  roomRef = ref(db, 'rooms/' + roomCode);
  await set(roomRef, {
    game: 'chess',
    createdAt: Date.now(),
    status: 'waiting',
    players: { w: { name: myName } },
    flags: {
      drawOffer: null, drawAccept: false,
      rematchOffer: null, rematchAccept: false,
      surrender: null, winner: null
    },
    presence: {},
    moves: {}
  });
  // очистить старые moves при создании (гарантия)
  onlineMode = true;
  playerSide = 'w'; aiSide = 'b';
  resetBoard();
  $('roomBar').style.display='flex';
  $('roomCode').textContent = roomCode;
  $('onlineScore').style.display='flex';
  matchScore = { w:0, b:0 }; renderOnlineScore();
  modeOverlay.classList.remove('show');
  subscribeRoom();
  showStatus('🔗 Поделись ссылкой или кодом с другом');
  trackEvent('room_created', { game_name:'chess' });
}

async function joinRoom(code){
  const { ref, set, onValue } = window.__FB__;
  await waitForFB();
  roomCode = code.toUpperCase();
  mySideOnline = 'b';
  myName = getUserName();
  roomRef = ref(db, 'rooms/' + roomCode);

  // Проверить, что комната существует
  const checkSnap = await new Promise(res=>{
    onValue(roomRef, s=>{ res(s); }, { onlyOnce:true });
    setTimeout(()=>res(null), 5000);
  });
  if (!checkSnap || !checkSnap.val()){
    alert('Комната не найдена: ' + roomCode);
    return;
  }
  const room = checkSnap.val();
  if (room.status === 'finished' && !room.flags?.rematchOffer){
    alert('Эта партия уже окончена. Создай новую комнату.');
    return;
  }
  if (room.players?.b && room.players.b.name !== myName){
    if (!confirm('В этой комнате уже есть чёрный игрок. Всё равно зайти?')) return;
  }
  await set(ref(roomRef, 'players/b'), { name: myName });
  await set(ref(roomRef, 'status'), 'playing');

  onlineMode = true;
  playerSide = 'b'; aiSide = 'w';
  resetBoard();
  $('roomBar').style.display='flex';
  $('roomCode').textContent = roomCode;
  $('onlineScore').style.display='flex';
  matchScore = { w:0, b:0 }; renderOnlineScore();
  modeOverlay.classList.remove('show');
  subscribeRoom();
  trackEvent('room_joined', { game_name:'chess' });
}

function leaveRoom(){
  onlineMode = false;
  roomRef = null;
  // отписка Firebase (onValue/childAdded не отменяются через API — создаём новую ref при новом входе)
  $('roomBar').style.display='none';
  $('onlineScore').style.display='none';
  roomCode = null;
  mySideOnline = null;
  // очистить промпты
  document.querySelectorAll('[data-prompt]').forEach(e=>e.remove());
}

function renderOnlineScore(){
  $('myScore').textContent = matchScore[mySideOnline] || 0;
  $('oppScore').textContent = matchScore[mySideOnline==='w'?'b':'w'] || 0;
}

/* ---------- Ход в онлайн-режиме ---------- */
async function sendMoveOnline(m){
  if (!roomRef) return;
  const { push, ref } = window.__FB__;
  await push(ref(roomRef, 'moves'), {
    by: mySideOnline,
    from: m.from, to: m.to,
    promo: m.promo || null,
    at: Date.now()
  });
  // сбросить флаги, если были предложения
  if (pendingFlags.drawOffer || pendingFlags.rematchOffer){
    pendingFlags = { drawOffer:null, rematchOffer:null };
  }
}

function applyRemoteMove(m){
  // m: {by, from, to, promo}
  if (turn !== (m.by)) {
    // Чужой ход, но сейчас не его очередь — странно, но проигнорируем
    return;
  }
  const legal = genLegal(turn);
  const cand = legal.find(x=>x.from===m.from && x.to===m.to && x.promo===(m.promo||null));
  if (!cand) return;
  const wasCap = !!cand.captured;
  makeMove(cand);
  wasCap? sCap() : sMove();
  tgHaptic('light');
  render();
  if (inCheck(turn)){ sCheck(); showStatus('⚠️ Шах тебе!', true); }
  else updateOnlineStatus();
  checkEndOnline();
}

function checkEndOnline(){
  const moves = genLegal(turn);
  if (moves.length===0){
    if (inCheck(turn)){
      const winner = turn==='w'?'b':'w';
      endGame(winner, 'checkmate');
    } else {
      endGame(null, 'stalemate');
    }
    return true;
  }
  if (halfmove>=100){endGame(null,'fifty');return true;}
  if (insufficient()){endGame(null,'material');return true;}
  return false;
}

function resetBoard(){
  board=initialBoard();
  turn='w';
  castling={wK:true,wQ:true,bK:true,bQ:true};
  epTarget=-1; halfmove=0;
  undoStack=[]; moveLog=[]; lastMove=null;
  gameOver=false; thinking=false; sel=-1; promoPending=null; legalCache=[];
  hidePromo(); endOverlay.classList.remove('show');
  document.querySelectorAll('[data-prompt]').forEach(e=>e.remove());
  render();
}

/* ---------- Кнопки комнаты ---------- */
function updateRoomActions(){
  const box = $('roomActions');
  // очистить все кнопки (кроме промптов)
  [...box.children].forEach(c=>{ if (!c.dataset.prompt) c.remove(); });
  if (!onlineMode || !roomRef) return;

  // Кнопка "Скопировать ссылку"
  const shareBtn = document.createElement('button');
  shareBtn.className='rbtn';
  shareBtn.textContent='📤 Пригласить';
  shareBtn.onclick = ()=>{
    const url = inviteLink(roomCode);
    const text = '♟️ Шахматы в Telegram. Заходи в комнату: ' + roomCode + '\n' + url;
    if (tg && tg.openTelegramLink){
      tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(url)+'&text='+encodeURIComponent(text));
    } else {
      navigator.clipboard?.writeText(url);
      alert('Ссылка скопирована:\n' + url);
    }
  };
  box.appendChild(shareBtn);

  // Кнопка "Код в буфер"
  const codeBtn = document.createElement('button');
  codeBtn.className='rbtn';
  codeBtn.textContent='🔢 Код';
  codeBtn.onclick = ()=>{
    navigator.clipboard?.writeText(roomCode);
    showStatus('Код ' + roomCode + ' скопирован');
  };
  box.appendChild(codeBtn);

  if (!gameOver){
    // Ничья
    const drawBtn = document.createElement('button');
    drawBtn.className='rbtn';
    drawBtn.textContent='🤝 Ничья';
    drawBtn.onclick = async ()=>{
      if (confirm('Предложить сопернику ничью?')){
        const { update } = window.__FB__;
        await update(roomRef, { 'flags/drawOffer': mySideOnline });
        pendingFlags.drawOffer = mySideOnline;
      }
    };
    box.appendChild(drawBtn);

    // Сдаться
    const surrBtn = document.createElement('button');
    surrBtn.className='rbtn danger';
    surrBtn.textContent='🏳 Сдаться';
    surrBtn.onclick = async ()=>{
      if (confirm('Признать поражение?')){
        const { update } = window.__FB__;
        await update(roomRef, { 'flags/surrender': mySideOnline });
      }
    };
    box.appendChild(surrBtn);

    // Выйти из комнаты
    const leaveBtn = document.createElement('button');
    leaveBtn.className='rbtn danger';
    leaveBtn.textContent='🚪 Выйти';
    leaveBtn.onclick = ()=>{
      if (confirm('Выйти из комнаты? Партия будет прервана.')){
        leaveRoom();
        resetBoard();
        modeOverlay.classList.add('show');
      }
    };
    box.appendChild(leaveBtn);
  }
}

/* ---------- Реванш ---------- */
async function proposeRematch(){
  if (!roomRef) return;
  const { update } = window.__FB__;
  await update(roomRef, {
    'flags/rematchOffer': mySideOnline,
    'flags/rematchAccept': false
  });
  showStatus('🔄 Ожидание согласия соперника...');
}

function startRematch(){
  // Очистить moves
  const { ref, remove, set, update } = window.__FB__;
  remove(ref(roomRef, 'moves'));
  // Сбросить флаги, поменять стороны местами
  const newW = mySideOnline==='w' ? 'b' : 'w';
  // обновить стороны: тот, кто был белым, станет чёрным
  // но mySideOnline остаётся той же ролью локально — просто меняем "кого считать белым"
  // Проще: mySideOnline остаётся прежним, но мы просто меняем местами в players
  update(roomRef, {
    'flags': {
      drawOffer:null, drawAccept:false,
      rematchOffer:null, rematchAccept:false,
      surrender:null, winner:null
    },
    'status':'playing'
  }).then(()=>{
    // локальный сброс
    resetBoard();
    // поменять стороны: mySideOnline меняется на противоположный
    mySideOnline = mySideOnline==='w' ? 'b' : 'w';
    playerSide = mySideOnline;
    aiSide = mySideOnline==='w'?'b':'w';
    render();
    showStatus('🔄 Реванш! Ты играешь за ' + (mySideOnline==='w'?'белых':'чёрных'));
    updateRoomActions();
  });
}

/* ---------- Перехват endGame для онлайн-режима ---------- */
const _origEndGame = null; // переопределим ниже через флаг

/* ================== ИНТЕРФЕЙС ================== */
const $=id=>document.getElementById(id);
const boardEl=$('board'), statusEl=$('status');
const settingsModal=$('settingsModal'), endOverlay=$('endOverlay'), promoOverlay=$('promoOverlay');
const modeOverlay=$('modeOverlay');
let sqEls=[];
(function buildBoard(){
  for(let v=0;v<64;v++){
    const d=document.createElement('div');
    d.className='sq';
    d.addEventListener('click',()=>onSquare(+d.dataset.i));
    boardEl.appendChild(d);
    sqEls.push(d);
  }
})();
const flipped=()=>playerSide==='b';
function orientIdx(vr,vc){ return flipped()? (7-vr)*8+(7-vc) : vr*8+vc; }

function render(){
  const chkSq = inCheck(turn)? kingSq(turn) : -1;
  for(let vr=0;vr<8;vr++)for(let vc=0;vc<8;vc++){
    const idx=orientIdx(vr,vc);
    const el=sqEls[vr*8+vc];
    el.dataset.i=idx;
    let cls='sq '+(((idx>>3)+(idx&7))%2===0?'light':'dark');
    if(idx===sel)cls+=' sel';
    if(lastMove&&(idx===lastMove.from||idx===lastMove.to))cls+=' last';
    if(idx===chkSq)cls+=' chk';
    if(sel!=null&&legalCache.some(m=>m.from===sel&&m.to===idx))cls+= board[idx]? ' capT':' tgt';
    el.className=cls;
    el.innerHTML='';
    const p=board[idx];
    if(p){ const s=document.createElement('span'); s.className='pc '+p.c; s.textContent=GLYPH[p.t]; el.appendChild(s); }
  }
  let byP='',byA='';
  for(const m of moveLog){
    if(m.captured){
      if(m.piece.c===playerSide)byP+=GLYPH[m.captured.t];
      else byA+=GLYPH[m.captured.t];
    }
  }
  $('capByPlayer').textContent=byP;
  $('capByAI').textContent=byA;
  $('undoBtn').disabled = onlineMode || !(moveLog.length>=2 && turn===playerSide && !thinking && !gameOver);
}
function updateStatus(txt,warn){ statusEl.textContent=txt; statusEl.classList.toggle('warn',!!warn); }
const showStatus = updateStatus;
function onSquare(idx){
  ensureAudio();
  if (gameOver) return;
  if (promoPending) return;
  if (onlineMode){
    if (thinking) return;
    if (turn !== mySideOnline) return;
    if (sel!=null){
      const cands=legalCache.filter(m=>m.from===sel&&m.to===idx);
      if(cands.length){
        if(cands[0].promo){ openPromo(cands); return; }
        doPlayerMoveOnline(cands[0]); return;
      }
    }
    const p=board[idx];
    if(p&&p.c===mySideOnline){ sel=idx; legalCache=genLegal(mySideOnline); sClick(); }
    else sel=-1;
    render();
  } else {
    if(thinking||turn!==playerSide)return;
    if(sel!=null){
      const cands=legalCache.filter(m=>m.from===sel&&m.to===idx);
      if(cands.length){
        if(cands[0].promo){ openPromo(cands); return; }
        doPlayerMove(cands[0]); return;
      }
    }
    const p=board[idx];
    if(p&&p.c===playerSide){ sel=idx; legalCache=genLegal(playerSide); sClick(); }
    else sel=-1;
    render();
  }
}
function doPlayerMove(m){
  sel=-1; legalCache=[];
  const wasCap=!!m.captured;
  makeMove(m);
  wasCap? sCap() : sMove();
  tgHaptic('light');
  render();
  if(inCheck(turn)){ sCheck(); updateStatus('⚠️ Шах компьютеру!',true); }
  if(checkEnd())return;
  aiTurn();
}
function doPlayerMoveOnline(m){
  sel=-1; legalCache=[];
  const wasCap=!!m.captured;
  makeMove(m);
  wasCap? sCap() : sMove();
  tgHaptic('light');
  render();
  // отправить в сеть
  sendMoveOnline(m);
  if(inCheck(turn)){ sCheck(); showStatus('⚠️ Шах сопернику!',true); }
  else updateOnlineStatus();
  checkEndOnline();
}
function aiTurn(){
  thinking=true;
  updateStatus('🤔 Компьютер думает...');
  setTimeout(()=>{
    const m=aiBestMove();
    thinking=false;
    if(!m){ checkEnd(); return; }
    const wasCap=!!m.captured;
    makeMove(m);
    wasCap? sCap() : sMove();
    render();
    if(inCheck(turn)){ sCheck(); updateStatus('⚠️ Шах вам!',true); }
    else updateStatus('Ваш ход');
    checkEnd();
  },120);
}
function undoMove(){
  if (onlineMode) return;
  if(moveLog.length<2||turn!==playerSide||thinking||gameOver)return;
  unmakeMove(); unmakeMove();
  sel=-1; legalCache=[];
  sClick();
  render(); updateStatus('Ваш ход');
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- окончание игры ---------- */
function endGame(winner,reason){
  if (gameOver) return;
  gameOver=true; thinking=false;
  const reasons={checkmate:'Мат',stalemate:'Пат — ничья',fifty:'Ничья по правилу 50 ходов',material:'Ничья: недостаточно материала',draw_agreed:'Ничья по соглашению',surrender:'Соперник сдался',flag:'Партия окончена'};
  let title,sub;

  if (onlineMode){
    // победа/проигрыш относительно своей стороны
    if (winner === mySideOnline){
      title = '🏆 Победа!';
      sub = reasons[reason] || '';
      matchScore[mySideOnline] = (matchScore[mySideOnline]||0) + 1;
      sWin(); tgHaptic('success');
      // записать в БД
      if (reason !== 'flag'){
        try{
          const { update } = window.__FB__;
          update(roomRef, { 'flags/winner': mySideOnline, 'status':'finished' });
        }catch(e){}
      }
    } else if (winner === null){
      title = '🤝 Ничья';
      sub = reasons[reason] || '';
      sDraw();
      if (reason !== 'flag'){
        try{
          const { update } = window.__FB__;
          update(roomRef, { 'flags/winner': 'draw', 'status':'finished' });
        }catch(e){}
      }
    } else {
      title = '💀 Поражение';
      sub = reasons[reason] || '';
      matchScore[winner] = (matchScore[winner]||0) + 1;
      sLose(); tgHaptic('error');
      if (reason !== 'flag'){
        try{
          const { update } = window.__FB__;
          update(roomRef, { 'flags/winner': winner, 'status':'finished' });
        }catch(e){}
      }
    }
    renderOnlineScore();
  } else {
    // одиночный режим
    if(winner==='player'){ title='🏆 Победа!'; sub=reasons[reason]; stats.w++; sWin(); tgHaptic('success'); }
    else if(winner==='computer'){ title='💀 Поражение'; sub=reasons[reason]; stats.l++; sLose(); tgHaptic('error'); }
    else{ title='🤝 Ничья'; sub=reasons[reason]; stats.d++; sDraw(); }
    saveStats(); displayStats();
  }

  trackEvent('game_end',{ game_name:'chess', mode:onlineMode?'online':'ai', difficulty:set.diff, side:playerSide, winner:winner||'draw', reason:reason, moves:moveLog.length });

  $('endTitle').textContent=title;
  $('endSub').textContent=sub+' · ходов: '+Math.ceil(moveLog.length/2);

  // кнопки: в онлайн-режиме — Реванш / Выйти
  const btns = $('endBtns');
  btns.innerHTML = '';
  if (onlineMode){
    btns.innerHTML = `
      <button class="btn primary" id="endRematchBtn">🔄 Реванш</button>
      <button class="btn" id="endShareBtn">📤 Поделиться</button>
      <button class="btn" id="endLeaveBtn">🚪 Выйти</button>
      <button class="btn" id="endHubBtn">🏠 В меню игр</button>
    `;
    $('endRematchBtn').onclick = proposeRematch;
    $('endShareBtn').onclick = shareGame;
    $('endLeaveBtn').onclick = ()=>{ leaveRoom(); resetBoard(); endOverlay.classList.remove('show'); modeOverlay.classList.add('show'); };
    $('endHubBtn').onclick = ()=>{ leaveRoom(); goToHub(); };
  } else {
    btns.innerHTML = `
      <button class="btn primary" id="endNewBtn">🔄 Ещё партию</button>
      <button class="btn" id="endShareBtn">📤 Поделиться</button>
      <button class="btn" id="endHubBtn">🏠 В меню игр</button>
    `;
    $('endNewBtn').onclick = ()=>{ sClick(); resetGameAI(); };
    $('endShareBtn').onclick = shareGame;
    $('endHubBtn').onclick = goToHub;
  }

  endOverlay.classList.add('show');
  updateStatus(title+' '+sub);
  render();
  updateRoomActions();
}

function shareGame(){
  const t=$('endTitle').textContent;
  const txt='♟️ Шахматы в Telegram: '+t+' '+$('endSub').textContent+'. Сыграй со мной!';
  const u='https://t.me/share/url?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(txt);
  if(tg&&tg.openTelegramLink)tg.openTelegramLink(u); else window.open(u,'_blank');
  trackEvent('game_share',{game_name:'chess'});
}

function checkEnd(){
  const moves=genLegal(turn);
  if(moves.length===0){
    if(inCheck(turn))endGame(turn===playerSide?'computer':'player','checkmate');
    else endGame(null,'stalemate');
    return true;
  }
  if(halfmove>=100){endGame(null,'fifty');return true;}
  if(insufficient()){endGame(null,'material');return true;}
  return false;
}

/* ---------- превращение пешки ---------- */
function openPromo(cands){
  promoPending=cands;
  const row=$('promoRow'); row.innerHTML='';
  const side = onlineMode ? mySideOnline : playerSide;
  for(const pr of['Q','R','B','N']){
    const b=document.createElement('button');
    b.className='promo-btn';
    const s=document.createElement('span');
    s.className='pc '+side;
    s.textContent=GLYPH[pr];
    b.appendChild(s);
    b.addEventListener('click',()=>{
      const m=cands.find(x=>x.promo===pr);
      hidePromo();
      if(m){
        if (onlineMode) doPlayerMoveOnline(m);
        else doPlayerMove(m);
      }
    });
    row.appendChild(b);
  }
  promoOverlay.classList.add('show');
}
function hidePromo(){ promoPending=null; promoOverlay.classList.remove('show'); }
function cancelPromo(){ hidePromo(); sel=-1; render(); }
$('promoCancel').onclick=cancelPromo;

/* ---------- кнопки и настройки ---------- */
function resetGameAI(){
  onlineMode = false;
  roomRef = null; roomCode = null; mySideOnline = null;
  $('roomBar').style.display='none';
  $('onlineScore').style.display='none';
  playerSide = set.side; aiSide = playerSide==='w'?'b':'w';
  resetBoard();
  updateStatus('Ваш ход');
  trackEvent('game_start',{ game_name:'chess', difficulty:set.diff, side:playerSide });
  if(turn!==playerSide) aiTurn();
}

$('newBtn').onclick=()=>{
  ensureAudio(); sClick();
  if (onlineMode){
    // в онлайне — "новая игра" = реванш
    if (!gameOver){
      if (confirm('Прервать партию и предложить реванш?')){
        proposeRematch();
      }
    } else {
      proposeRematch();
    }
  } else {
    resetGameAI();
  }
};
$('undoBtn').onclick=()=>{ ensureAudio(); undoMove(); };
$('hubBtn').onclick=goToHub;
$('settingsBtn').onclick=()=>{ ensureAudio(); sClick(); displayStats(); settingsModal.classList.add('show'); };
$('closeSettingsBtn').onclick=()=>settingsModal.classList.remove('show');
settingsModal.addEventListener('click',e=>{ if(e.target===settingsModal)settingsModal.classList.remove('show'); });
$('resetStatsBtn').onclick=()=>{ if(confirm('Сбросить статистику?')){ stats={w:0,l:0,d:0}; saveStats(); displayStats(); } };

function displayStats(){ $('stW').textContent=stats.w; $('stL').textContent=stats.l; $('stD').textContent=stats.d; }
function applyTheme(){
  if(set.theme==='classic')document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', set.theme);
  const hdr={classic:'#101418',green:'#20301c',neon:'#14162a'}[set.theme]||'#101418';
  tgHeaderColor(hdr);
}
$('diffSelect').onchange=e=>{ set.diff=e.target.value; saveSet(); trackEvent('settings_change',{game_name:'chess',setting:'difficulty',value:set.diff}); };
$('sideSelect').onchange=e=>{ set.side=e.target.value; saveSet(); trackEvent('settings_change',{game_name:'chess',setting:'side',value:set.side}); if (!onlineMode) updateStatus('Сторона применится в новой игре'); };
$('themeSelect').onchange=e=>{ set.theme=e.target.value; saveSet(); applyTheme(); trackEvent('settings_change',{game_name:'chess',setting:'theme',value:set.theme}); };
$('volSlider').oninput=e=>{ set.vol=e.target.value/100; $('volV').textContent=e.target.value+'%'; saveSet(); if(MASTER)MASTER.gain.value=set.vol; };

/* ---------- Экран выбора режима ---------- */
$('modeAi').onclick = ()=>{
  ensureAudio(); sClick();
  modeOverlay.classList.remove('show');
  resetGameAI();
};
$('modeHost').onclick = async ()=>{
  ensureAudio(); sClick();
  await createRoom();
};
$('modeJoin').onclick = ()=>{
  $('joinCodeBox').style.display='flex';
  $('joinCodeActions').style.display='flex';
  $('joinCodeInput').value='';
  $('joinCodeInput').focus();
};
$('joinCancel').onclick = ()=>{
  $('joinCodeBox').style.display='none';
  $('joinCodeActions').style.display='none';
};
$('joinGo').onclick = async ()=>{
  const code = $('joinCodeInput').value.trim().toUpperCase();
  if (code.length !== 6){ alert('Введи 6-значный код'); return; }
  await joinRoom(code);
};

/* ---------- инициализация ---------- */
(function loadSettings(){
  $('diffSelect').value=set.diff;
  $('sideSelect').value=set.side;
  $('themeSelect').value=set.theme;
  $('volSlider').value=Math.round(set.vol*100);
  $('volV').textContent=Math.round(set.vol*100)+'%';
  applyTheme();
  displayStats();
})();

// Старт: если в URL есть ?room=XXX — сразу заходим, иначе экран выбора
(async function initStart(){
  const url = new URL(location.href);
  const urlRoom = url.searchParams.get('room');
  if (urlRoom && urlRoom.length === 6){
    // авто-вход
    await joinRoom(urlRoom);
  } else {
    // одиночный режим по умолчанию: показать экран выбора один раз
    // Но если юзер уже в игре (вернулся) — не перекрывать
    modeOverlay.classList.add('show');
  }
})();
</script>
